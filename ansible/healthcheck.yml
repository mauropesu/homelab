---
- name: Deploy healthcheck
  hosts: all
  become: true

  tasks:
    - name: Install cronie
      ansible.builtin.dnf:
        name: cronie
        state: present

    - name: Ensure crond is running and enabled
      ansible.builtin.systemd:
        name: crond
        state: started
        enabled: true

    - name: Copy healthcheck script
      ansible.builtin.copy:
        src: files/healthcheck.sh
        dest: /usr/local/bin/healthcheck.sh
        owner: root
        group: root
        mode: "0755"

    - name: Schedule healthcheck every 5 minutes
      ansible.builtin.cron:
        name: "healthcheck"
        minute: "*/5"
        job: "/usr/local/bin/healthcheck.sh >> /var/log/healthcheck.log 2>&1"
