---
- name: Server baseline
  hosts: all
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - vim-enhanced
          - tmux
          - nfs-utils
          - cifs-utils
        state: present

    - name: Create dbadmin service user
      ansible.builtin.user:
        name: dbadmin
        shell: /bin/bash
        comment: "Database admin"

    - name: Configure motd
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Managed by Ansible - {{ inventory_hostname }}\n"
        mode: "0644"
